[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mytorch"
version = "0.9.0"
description = "A GPU-only educational tensor and autograd framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cupy>=14.2,<14.3",
  "numpy>=2.0,<2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires a working NVIDIA CUDA GPU",
]

[tool.coverage.run]
branch = true
source = ["mytorch"]

[tool.coverage.report]
fail_under = 77
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mytorch"]
