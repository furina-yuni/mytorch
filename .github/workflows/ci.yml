name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install --upgrade build ruff twine
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Check formatting
        run: ruff format --check src tests examples scripts
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Inspect distribution contents
        run: python scripts/check_release.py --dist-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: mytorch-gpu-dist
          path: dist/*
          if-no-files-found: error

