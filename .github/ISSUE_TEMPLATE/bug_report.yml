name: Bug report
description: Report reproducible incorrect behavior in MyTorch
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private data, or vulnerability details.
        Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: MyTorch version
      placeholder: 0.12.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, Python, GPU, NVIDIA driver, CuPy and CUDA runtime versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
    validations:
      required: true

